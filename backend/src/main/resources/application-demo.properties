server.port=8080

# Fallback in-memory database in MySQL mode for offline/demonstration when MySQL service is not running
spring.datasource.url=jdbc:h2:mem:campusbite_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

logging.level.com.campusbite=DEBUG
logging.level.org.springframework.web=INFO
